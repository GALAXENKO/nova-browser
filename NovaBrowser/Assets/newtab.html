<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>Новая вкладка</title>
<style>
  :root {
    --ink: #f4f7ff;
    --muted: #aeb9d4;
    --glass: rgba(20, 28, 49, 0.58);
    --line: rgba(255, 255, 255, 0.13);
    --accent: #7f9aff;
    --accent-2: #b388ff;
    --shadow: rgba(3, 8, 24, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b1122;
    color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px;
    position: relative;
    isolation: isolate;
  }

  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 18% 18%, rgba(67, 93, 255, 0.34), transparent 36%),
      radial-gradient(circle at 82% 22%, rgba(155, 74, 255, 0.27), transparent 34%),
      radial-gradient(circle at 50% 105%, rgba(18, 137, 173, 0.26), transparent 48%),
      linear-gradient(150deg, #080d1a 0%, #101a33 52%, #0a1122 100%);
    z-index: -4;
  }

  .aurora {
    position: fixed;
    width: 58vw;
    height: 58vw;
    max-width: 820px;
    max-height: 820px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.36;
    z-index: -3;
    animation: drift 18s ease-in-out infinite alternate;
  }

  .aurora.one {
    top: -28%;
    left: -12%;
    background: conic-gradient(from 140deg, #314dff, #7c3cff, #18a4c9, #314dff);
  }

  .aurora.two {
    right: -24%;
    bottom: -30%;
    background: conic-gradient(from 20deg, #7936ff, #1e75ff, #2bd0c4, #7936ff);
    animation-delay: -7s;
    opacity: 0.24;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: -2;
    opacity: 0.18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .glow {
    position: fixed;
    width: 46vw;
    height: 46vw;
    max-width: 640px;
    max-height: 640px;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88, 111, 255, 0.16), transparent 68%);
    z-index: -1;
    pointer-events: none;
  }

  main {
    width: min(820px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: appear 0.75s cubic-bezier(.2,.8,.2,1) both;
  }

  .topline {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 42px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--ink);
    user-select: none;
  }

  .mark {
    width: 35px;
    height: 35px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(140deg, #6e8bff 0%, #9f6bff 100%);
    box-shadow: 0 9px 24px rgba(89, 107, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  .brand-name {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }

  .brand-name span { color: var(--muted); font-weight: 400; }

  .gear {
    width: 37px;
    height: 37px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.045);
    color: var(--muted);
    border-radius: 11px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: .18s ease;
  }

  .gear:hover {
    color: #fff;
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.24);
    transform: translateY(-1px);
  }

  .gear svg { width: 17px; height: 17px; }

  .hero {
    text-align: center;
    margin-bottom: 29px;
  }

  .clock {
    font-size: clamp(46px, 7vw, 70px);
    line-height: 1;
    font-weight: 250;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 8px 36px rgba(0,0,0,0.24);
  }

  .clock .colon {
    opacity: 0.55;
    animation: blink 2s steps(1) infinite;
  }

  .date {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13.5px;
    letter-spacing: 0.5px;
    text-transform: capitalize;
  }

  .search {
    width: 100%;
    position: relative;
    filter: drop-shadow(0 22px 38px rgba(2, 7, 22, 0.38));
  }

  .search-box {
    display: flex;
    align-items: center;
    height: 62px;
    padding: 0 19px;
    gap: 13px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.17);
    background: linear-gradient(180deg, rgba(31, 42, 70, 0.76), rgba(17, 25, 45, 0.72));
    backdrop-filter: blur(24px) saturate(130%);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  .search-box:focus-within {
    border-color: rgba(143, 163, 255, 0.74);
    background: linear-gradient(180deg, rgba(35, 47, 78, 0.9), rgba(18, 27, 49, 0.84));
    box-shadow: 0 0 0 4px rgba(98, 121, 255, 0.14), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .search-box svg {
    width: 20px;
    height: 20px;
    flex: none;
    color: #9aa9c9;
  }

  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15.5px;
    letter-spacing: 0.1px;
  }

  #q::placeholder { color: #8d99b5; }

  .hint {
    flex: none;
    color: #8290ad;
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .3px;
  }

  .quick {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
    margin-top: 28px;
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 15px 8px 13px;
    border-radius: 15px;
    border: 1px solid transparent;
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }

  .tile:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.055);
    border-color: rgba(255,255,255,0.1);
    color: var(--ink);
  }

  .icon {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.23), inset 0 1px 0 rgba(255,255,255,0.28);
  }

  .tile span {
    font-size: 11.5px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tile.google .icon { background: linear-gradient(135deg, #4285f4, #34a853 54%, #fbbc05 78%, #ea4335); }
  .tile.youtube .icon { background: linear-gradient(135deg, #ff2d2d, #c40000); }
  .tile.github .icon { background: linear-gradient(135deg, #4a5262, #171b22); }
  .tile.wiki .icon { background: linear-gradient(135deg, #eceff3, #c8ced8); color: #1d2637; }
  .tile.reddit .icon { background: linear-gradient(135deg, #ff6a24, #d93900); }
  .tile.steam .icon { background: linear-gradient(135deg, #2b4c7e, #0f1c2e); }

  footer {
    margin-top: 47px;
    color: #68748f;
    font-size: 10.5px;
    letter-spacing: .2px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  footer .dot { width: 3px; height: 3px; border-radius: 50%; background: #596783; }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) rotate(0deg) scale(1); }
    to { transform: translate3d(3%, 3%, 0) rotate(16deg) scale(1.08); }
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(13px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink { 0%, 49% { opacity: .55; } 50%, 100% { opacity: .18; } }

  @media (max-width: 660px) {
    body { padding: 24px; }
    .topline { margin-bottom: 30px; }
    .quick { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .search-box { height: 56px; }
    .hint { display: none; }
    .clock { letter-spacing: -2px; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="aurora one"></div>
  <div class="aurora two"></div>
  <div class="grain"></div>
  <div class="glow"></div>

  <main>
    <div class="topline">
      <div class="brand">
        <div class="mark">N</div>
        <div class="brand-name">Nova <span>Browser</span></div>
      </div>
      <button class="gear" id="settings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.3.75.6 1 .3.26.7.4 1.1.4H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6z"></path>
        </svg>
      </button>
    </div>

    <section class="hero">
      <div class="clock" id="clock">--<span class="colon">:</span>--</div>
      <div class="date" id="date"></div>
    </section>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="M15.8 15.8 21 21"></path>
        </svg>
        <input id="q" type="text" placeholder="Поиск в интернете или адрес сайта" aria-label="Поиск" spellcheck="false" autofocus>
        <span class="hint">Enter</span>
      </div>
    </form>

    <nav class="quick" aria-label="Быстрые ссылки">
      <a class="tile google" data-url="https://www.google.com" title="Google">
        <span class="icon">G</span><span>Google</span>
      </a>
      <a class="tile youtube" data-url="https://www.youtube.com" title="YouTube">
        <span class="icon">▶</span><span>YouTube</span>
      </a>
      <a class="tile github" data-url="https://github.com" title="GitHub">
        <span class="icon">⌘</span><span>GitHub</span>
      </a>
      <a class="tile wiki" data-url="https://ru.wikipedia.org" title="Википедия">
        <span class="icon">W</span><span>Википедия</span>
      </a>
      <a class="tile reddit" data-url="https://www.reddit.com" title="Reddit">
        <span class="icon">r</span><span>Reddit</span>
      </a>
      <a class="tile steam" data-url="https://store.steampowered.com" title="Steam">
        <span class="icon">S</span><span>Steam</span>
      </a>
    </nav>

    <footer>
      <span>Nova Browser</span><span class="dot"></span><span>работает на Chromium</span>
    </footer>
  </main>

<script>
  const clock = document.getElementById('clock');
  const date = document.getElementById('date');
  const input = document.getElementById('q');
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const weekdays = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  function updateTime() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    clock.innerHTML = hh + '<span class="colon">:</span>' + mm;
    date.textContent = weekdays[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
  }

  updateTime();
  setInterval(updateTime, 1000);

  function post(payload) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(payload);
      return true;
    }
    return false;
  }

  document.getElementById('searchForm').addEventListener('submit', event => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    if (!post({ type: 'search', query })) {
      window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    }
  });

  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', event => {
      event.preventDefault();
      const url = tile.dataset.url;
      if (!post({ type: 'navigate', url })) {
        window.location.href = url;
      }
    });
  });

  document.getElementById('settings').addEventListener('click', () => {
    post({ type: 'settings' });
  });

  document.addEventListener('keydown', event => {
    if (event.key === '/' && document.activeElement !== input) {
      event.preventDefault();
      input.focus();
      input.select();
    }
  });
</script>
</body>
</html>
